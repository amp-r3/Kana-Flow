name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Never deploy two builds of the same branch at once; a newer commit wins.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  CLOUDFLARE_PROJECT_NAME: nekotype

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: node -v && pnpm -v

      - run: pnpm install --frozen-lockfile

      # `verify` runs e2e, which needs Chromium. The browser download is cached by the lockfile;
      # system packages are installed on every run (cheap when already present).
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Chromium for e2e
        run: pnpm --filter @nekotype/web exec playwright install --with-deps chromium

      # typecheck + lint + Prettier + unit tests with coverage + build + size budget + e2e.
      # `verify` already produces apps/web/dist, so no second build is needed.
      - run: pnpm run verify

      - name: Resolve branch name
        id: branch
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "name=pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      # First run only: creates the Pages project. Later runs fail harmlessly.
      - name: Ensure Pages project exists
        run: pnpm dlx wrangler@4 pages project create "$CLOUDFLARE_PROJECT_NAME" --production-branch=main || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Pushes to main -> production, PRs -> preview deployment with its own URL.
      # Fork PRs have no access to secrets, so they only run the verify job.
      - name: Deploy to Cloudflare Pages
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: pnpm dlx wrangler@4 pages deploy apps/web/dist --project-name="$CLOUDFLARE_PROJECT_NAME" --branch="${{ steps.branch.outputs.name }}" --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # wrangler writes the address of the new deployment here (one JSON object per line).
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson

      # Some behaviour exists only on Cloudflare Pages: a rewrite to /index.html is answered with a
      # 308 (ADR 039), and a missing /assets file must be a real 404 (ADR 037). The dev server and the
      # unit tests cannot show either, so request the deployment itself: every route answers 200
      # with the application, a missing asset and an unknown path answer 404, the bundle loads.
      # It waits for the new deployment to answer first. Falls back to the branch alias if wrangler
      # wrote no address.
      - name: Smoke-test the deployment
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
        run: |
          if [ "$BRANCH" = "main" ]; then
            FALLBACK="https://${CLOUDFLARE_PROJECT_NAME}.pages.dev"
          else
            ALIAS=$(echo "$BRANCH" | tr 'A-Z/_.' 'a-z---')
            FALLBACK="https://${ALIAS}.${CLOUDFLARE_PROJECT_NAME}.pages.dev"
          fi
          pnpm --filter @nekotype/web exec tsx scripts/smoke-deploy.mjs \
            --wrangler-output "$WRANGLER_OUTPUT_FILE_PATH" --fallback "$FALLBACK"
