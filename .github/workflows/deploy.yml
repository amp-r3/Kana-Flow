name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Never deploy two builds of the same branch at once; a newer commit wins.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  CLOUDFLARE_PROJECT_NAME: nekotype

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # package-lock.json was generated by npm 11. The npm 10 bundled with
      # Node 22 rejects that tree as out of sync (`npm ci` EUSAGE), so pin the
      # major that produced the lockfile instead of trusting the runner default.
      - run: npm i -g npm@11
      - run: node -v && npm -v

      - run: npm ci

      # typecheck + FSD lint + unit tests + build + size budget.
      # `verify` already produces dist/, so no second build is needed.
      - run: npm run verify

      - name: Resolve branch name
        id: branch
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "name=pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      # First run only: creates the Pages project. Later runs fail harmlessly.
      - name: Ensure Pages project exists
        run: npx --yes wrangler@4 pages project create "$CLOUDFLARE_PROJECT_NAME" --production-branch=main || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Pushes to main -> production, PRs -> preview deployment with its own URL.
      # Fork PRs have no access to secrets, so they only run the verify job.
      - name: Deploy to Cloudflare Pages
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: npx --yes wrangler@4 pages deploy dist --project-name="$CLOUDFLARE_PROJECT_NAME" --branch="${{ steps.branch.outputs.name }}" --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
